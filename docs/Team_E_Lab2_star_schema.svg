<text class="ti" x="40" y="38">Team E, Lab 2: star schema for the Adult census warehouse (DuckDB)</text>
<text class="lg" x="40" y="60">PK primary key, FK foreign key, UQ unique. Arrows run from each foreign key to the primary key it references.</text>
<text class="lg" x="40" y="78">One fact table at the grain of one person, eight conformed dimensions. 32,561 fact rows.</text>
